metadata:
  note: >
    Superpopulation classifier (CNN2), the "DITA no masks" baseline in the
    alignment-comparison set -- mirrors pigmentation/pigmentation_binary.yaml exactly
    (same genes/ontologies/haplotype_mode/window_center_size/architecture/hyperparameters,
    alignment_mapping="bcftools_chain", feature_mode="signals_only") except
    output.prediction_target="superpopulation" instead of the derived pigmentation binary
    label. Companion to superpopulation_no_alignment.yaml, superpopulation_all_masks.yaml,
    superpopulation_dita_masks_0_5.yaml and superpopulation_dita_masks_0_25.yaml -- together
    these 5 configs replicate the pigmentation notebook's 5-way alignment/mask comparison
    (see notebooks/genotype_cnn_alignment_deeplift_summary.ipynb) on the superpopulation
    task instead of weak/strong pigmentation.

    prediction_target="superpopulation" is a native target (pedigree "superpopulation"
    field, 5 classes: AFR/AMR/EAS/EUR/SAS), not a derived_targets mapping, so no
    output.derived_targets block is needed here.

    Uses its own processed_cache_dir (not the "pigmentation" one) because the dataset
    view-cache key includes prediction_target (see generate_dataset_name in config.py) --
    switching targets can never reuse the pigmentation tensor cache anyway, so there is no
    reuse benefit to sharing the directory, only confusion.

    data_loading.loading_strategy="lazy" (not "preload" like the pigmentation siblings):
    the superpopulation target covers ~3202 individuals vs. the pigmentation subset's 1072
    (8 populations only), close to 3x more. The pigmentation_binary_all_masks.yaml note
    documents that its 220-row/sample preload already "just barely survived" 124GB RAM at
    1072 individuals single-process -- at 3x the individuals that would almost certainly
    OOM, and this run needs to survive unattended overnight. Lazy loading forces
    num_workers=0 automatically (see _make_data_loaders in data/pipeline.py) so it is safe
    with no further tuning, at the cost of per-batch disk I/O instead of full RAM residency.

    checkpointing.save_frequency=50 instead of the pigmentation siblings' 100: purely an
    unattended-run safety margin (finer-grained epoch_N.pt resume points if the process is
    killed between validation improvements), not a modeling choice -- doesn't affect
    architecture/training comparability across the 5 configs.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/superpopulation"
  results_dir: "results/genotype_based_predictor/runs"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "MC1R"
    - "TYRP1"
    - "TYR"
    - "SLC45A2"
    - "DDB1"
    - "EDAR"
    - "MFSD12"
    - "OCA2"
    - "HERC2"
    - "SLC24A5"
    - "TCHH"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # Alignment and feature selection
  tensor_layout: "haplotype_channels"
  feature_mode: "signals_only"
  selected_track_index: 0
  indel_include_valid_mask: false
  indel_include_snp_mask: false
  alignment_mapping: "bcftools_chain"
  consensus_dataset_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"
  alignment_axis_splits:
    - train

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "superpopulation"
  known_classes: null

model:
  type: "CNN2"
  hidden_layers: [100, 40]
  activation: "relu"
  dropout_rate: 0.5
  cnn:
    kernel_size: [6, 32]
    num_filters: 5
    stride: [6, 32]
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    kernel_stage1: [6, 32]
    stride_stage1: [6, 32]
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23: [1, 5]
    stride_stages23: [1, 2]
    padding_stages23: [0, 2]
    fc_hidden_size: 256
    global_pool_type: "avg"
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      random_state: 42
      n_jobs: -1
      eval_metric: "logloss"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "cross_entropy"
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    mode: "min"
    factor: 0.5
    patience: 30
    min_lr: 0.0000001
    step_size: 30
    T_max: 300
    eta_min: 0.0000001
    T_0: 50
    T_mult: 1

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-neural-legacy"
  run_name: "superpopulation-dita-no-masks"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 50
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  loading_strategy: "lazy"
  cache_size: 50

mode: "train"
test_dataset: "test"
