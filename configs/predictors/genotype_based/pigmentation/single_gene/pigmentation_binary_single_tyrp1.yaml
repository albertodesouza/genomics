metadata:
  note: >
    SINGLE-GENE ARM -- TYRP1 alone, generated by scripts/experiments/single_gene_sweep.py.
    Identical to pigmentation_binary_no_alignment.yaml in every respect (layout, crop,
    ontologies, architecture, optimisation, split, seed) except genes_to_use (one gene),
    results_dir and run_name.

    WHY ONE MODEL PER GENE. The panel-based specificity control couples every gene to
    every other: a control gene has to be inside the classifier's input to have any
    Delta, so adding one means retraining, and a retrain invalidates the other genes'
    published Delta values. Adding the k-th control costs a retrain plus k
    remeasurements. One classifier per gene removes the coupling entirely -- each arm is
    independent, adding a gene is O(1), and nothing already measured is invalidated.

    WHAT THIS MEASURES. Not reliance in a panel, which is what the paper's claim is
    about and which this does not replace. With one gene in the input there is nothing
    to route to, so the accuracy measures the INFORMATION the window carries about the
    label and the knockdown measures the same 100 bp promoter scramble with reliance
    pinned at its maximum. A control gene cannot be flat here merely because panel genes
    crowded it out.

    ISOLATED results_dir. The run name is derived from architecture and layout only and
    does NOT include the gene list, so every raw_center_crop CNN2 arm resolves to the
    same directory name. A shared results_dir silently overwrites the published run;
    that happened on 2026-09-06 and destroyed a checkpoint.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/pigmentation"
  results_dir: "results/genotype_based_predictor/runs_single_gene_tyrp1"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "TYRP1"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # No alignment: legacy raw center-crop layout, no INDEL-aware coordinate axis
  tensor_layout: "raw_center_crop"
  feature_mode: "signals_only"
  selected_track_index: 0

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "pigmentation"
  known_classes:
    - "strong pigmentation"
    - "weak pigmentation"
  derived_targets:
    pigmentation:
      source_field: "population"
      exclude_unmapped: true
      class_map:
        strong pigmentation: ["YRI", "ESN", "LWK", "MSL", "GWD"]
        weak pigmentation: ["FIN", "CEU", "GBR"]

model:
  type: "CNN2"
  hidden_layers: [100, 40]
  activation: "relu"
  dropout_rate: 0.5
  cnn:
    kernel_size: [6, 32]
    num_filters: 5
    stride: [6, 32]
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    # Same per-gene-per-haplotype channel count as pigmentation_binary.yaml's signals_only
    # layout: 2 strands x 3 ontology terms = 6, no mask channels (raw_center_crop has none).
    kernel_stage1: [6, 32]
    stride_stage1: [6, 32]
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23: [1, 5]
    stride_stages23: [1, 2]
    padding_stages23: [0, 2]
    fc_hidden_size: 256
    global_pool_type: "avg"
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      random_state: 42
      n_jobs: -1
      eval_metric: "logloss"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "cross_entropy"
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    mode: "min"
    factor: 0.5
    patience: 30
    min_lr: 0.0000001
    step_size: 30
    T_max: 300
    eta_min: 0.0000001
    T_0: 50
    T_mult: 1

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-neural-legacy"
  run_name: "pigmentation-binary-single-gene-tyrp1"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  loading_strategy: "preload"

mode: "train"
test_dataset: "test"
