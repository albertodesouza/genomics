metadata:
  note: >
    SINGLE-GENE ARM -- SLC24A5 alone. Identical in every respect to
    pigmentation_binary_no_alignment.yaml (same layout, crop, ontologies, architecture,
    optimisation, split, seed) except genes_to_use (one gene), results_dir and run_name.

    WHAT THIS TESTS. In the eleven-gene panel the knockdown readout reports RELIANCE: how much
    THIS classifier's decision moves when a gene's promoter is scrambled. A gene can be flat
    for two different reasons -- it carries no information about the label, or it carries
    information the classifier chose not to use because another gene carries it more cheaply.
    The panel measurement cannot separate them. Training on ONE gene removes the choice: the
    classifier has nothing else to rely on, so the single-gene accuracy measures the
    INFORMATION the gene's window carries about the label, and the single-gene knockdown
    measures the delivered perturbation's effect with reliance held at its maximum.

    Read against the panel model:
      high single-gene accuracy + large panel Delta   -> used, and informative.
      high single-gene accuracy + small panel Delta   -> informative but REDUNDANT: the panel
                                                         model routes around it. The panel
                                                         ranking is about reliance, not content.
      low single-gene accuracy                        -> the window carries little label
                                                         information; a small panel Delta is
                                                         then uninformative about redundancy.

    GENE CHOICE. SLC24A5 and TYR are the two arms. Both respond in the panel, but with opposite
    efficiency: SLC24A5 moves the decision by 0.503 at the SMALLEST delivered perturbation in
    the panel (|Delta_in| = 6,537; ratio 7.7e-5, the largest), while TYR moves it 0.337 at the
    LARGEST delivered perturbation (|Delta_in| = 54,297; ratio 6.2e-6, 12x less efficient).
    Reference values: results/genotype_based_predictor/readout_normalisation.json.

    ISOLATED results_dir. The run name is derived from architecture and layout parameters only
    and does NOT include the gene list, so every raw_center_crop CNN2 arm resolves to the same
    directory name. A shared results_dir would silently overwrite the published run; that
    happened on 2026-09-06 and destroyed a checkpoint.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/pigmentation"
  results_dir: "results/genotype_based_predictor/runs_single_gene_slc24a5"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "SLC24A5"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # No alignment: legacy raw center-crop layout, no INDEL-aware coordinate axis
  tensor_layout: "raw_center_crop"
  feature_mode: "signals_only"
  selected_track_index: 0

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "pigmentation"
  known_classes:
    - "strong pigmentation"
    - "weak pigmentation"
  derived_targets:
    pigmentation:
      source_field: "population"
      exclude_unmapped: true
      class_map:
        strong pigmentation: ["YRI", "ESN", "LWK", "MSL", "GWD"]
        weak pigmentation: ["FIN", "CEU", "GBR"]

model:
  type: "CNN2"
  hidden_layers: [100, 40]
  activation: "relu"
  dropout_rate: 0.5
  cnn:
    kernel_size: [6, 32]
    num_filters: 5
    stride: [6, 32]
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    # Same per-gene-per-haplotype channel count as pigmentation_binary.yaml's signals_only
    # layout: 2 strands x 3 ontology terms = 6, no mask channels (raw_center_crop has none).
    kernel_stage1: [6, 32]
    stride_stage1: [6, 32]
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23: [1, 5]
    stride_stages23: [1, 2]
    padding_stages23: [0, 2]
    fc_hidden_size: 256
    global_pool_type: "avg"
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      random_state: 42
      n_jobs: -1
      eval_metric: "logloss"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "cross_entropy"
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    mode: "min"
    factor: 0.5
    patience: 30
    min_lr: 0.0000001
    step_size: 30
    T_max: 300
    eta_min: 0.0000001
    T_0: 50
    T_mult: 1

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-neural-legacy"
  run_name: "pigmentation-binary-single-gene-slc24a5"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  loading_strategy: "preload"

mode: "train"
test_dataset: "test"
