# GERADO por scripts/experiments/parallel_sweep_fixed.py -- nao editar a mao
metadata:
  note: SWEEP CORRIGIDO (cachewarm), gene PRSS55, melanocito CL:1000458 + strand do
    gene, eixo DITA. batch_size=32, scheduler=cosine, num_epochs=400 -> ~9600 passos
    de otimizador (a config que colapsou fazia 1200). Gerado por scripts/experiments/parallel_sweep_fixed.py.
    Identico ao braco melstranddita em split, seed, crop, layout, ontologia e arquitetura.
dataset_input:
  dataset_id: 1kg_high_coverage
  processed_cache_dir: results/cache/genotype_based_predictor/cachewarm_prss55_cachewarm
  results_dir: results/genotype_based_predictor/runs_cachewarm/prss55_cachewarm
  cache_processed_tensors: true
  alphagenome_outputs:
  - rna_seq
  haplotype_mode: H1+H2
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
  - PRSS55
  ontology_terms:
  - CL:1000458
  tensor_layout: haplotype_channels
  feature_mode: signals_only
  selected_track_index: 0
  indel_include_valid_mask: false
  indel_include_snp_mask: false
  alignment_mapping: bcftools_chain
  consensus_dataset_dir: /dados/GENOMICS_DATA/v1/1kG_high_coverage
  alignment_axis_splits:
  - train
  normalization_method: log
  normalization_value: 0.0
  normalization_fit_splits:
  - train
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true
  track_strands:
  - +
output:
  prediction_target: pigmentation
  known_classes:
  - strong pigmentation
  - weak pigmentation
  derived_targets:
    pigmentation:
      source_field: population
      exclude_unmapped: true
      class_map:
        strong pigmentation:
        - YRI
        - ESN
        - LWK
        - MSL
        - GWD
        weak pigmentation:
        - FIN
        - CEU
        - GBR
model:
  type: CNN2
  hidden_layers:
  - 100
  - 40
  activation: relu
  dropout_rate: 0.5
  cnn:
    kernel_size:
    - 1
    - 32
    num_filters: 5
    stride:
    - 1
    - 32
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    kernel_stage1:
    - 1
    - 32
    stride_stage1:
    - 1
    - 32
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23:
    - 1
    - 5
    stride_stages23:
    - 1
    - 2
    padding_stages23:
    - 0
    - 2
    fc_hidden_size: 256
    global_pool_type: avg
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: hist
      random_state: 42
      n_jobs: -1
      eval_metric: logloss
training:
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: cross_entropy
  batch_size: 32
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: cosine
    mode: min
    factor: 0.5
    patience: 30
    min_lr: 1.0e-07
    step_size: 30
    T_max: 400
    eta_min: 1.0e-07
    T_0: 50
    T_mult: 1
data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: family_aware
  balancing_strategy: shuffle
  strict_determinism: true
wandb:
  use_wandb: false
  project_name: genotype-based-predictor-neural-legacy
  run_name: cachewarm-prss55
  log_frequency: 100
checkpointing:
  checkpoint_dir: models
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null
debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}
data_loading:
  loading_strategy: preload
mode: train
test_dataset: test
