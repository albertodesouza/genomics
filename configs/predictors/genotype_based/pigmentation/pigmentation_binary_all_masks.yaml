metadata:
  note: >
    Pigmentation binary classifier (CNN2), identical to pigmentation_binary.yaml except
    feature_mode="signals_and_masks" with both optional INDEL mask channels enabled
    (indel_include_valid_mask=true, indel_include_snp_mask=true) instead of
    feature_mode="signals_only". Uses alignment_mapping="bcftools_chain" -- INDEL masks are
    not yet implemented for alignment_mapping="reference_realign" (see config.py's
    validate_reference_realign_scope guard). Meant as a direct, apples-to-apples comparison
    against pigmentation_binary.yaml's trained model to see whether giving the CNN explicit
    INDEL/SNP location channels (on top of the aligned AlphaGenome signal) changes accuracy
    or attribution patterns.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/pigmentation"
  results_dir: "results/genotype_based_predictor/runs"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "MC1R"
    - "TYRP1"
    - "TYR"
    - "SLC45A2"
    - "DDB1"
    - "EDAR"
    - "MFSD12"
    - "OCA2"
    - "HERC2"
    - "SLC24A5"
    - "TCHH"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # Alignment and feature selection
  tensor_layout: "haplotype_channels"
  feature_mode: "signals_and_masks"
  selected_track_index: 0
  indel_include_valid_mask: true
  indel_include_snp_mask: true
  alignment_mapping: "bcftools_chain"
  consensus_dataset_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"
  alignment_axis_splits:
    - train

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "pigmentation"
  known_classes:
    - "strong pigmentation"
    - "weak pigmentation"
  derived_targets:
    pigmentation:
      source_field: "population"
      exclude_unmapped: true
      class_map:
        strong pigmentation: ["YRI", "ESN", "LWK", "MSL", "GWD"]
        weak pigmentation: ["FIN", "CEU", "GBR"]

model:
  type: "CNN2"
  hidden_layers: [100, 40]
  activation: "relu"
  dropout_rate: 0.5
  cnn:
    kernel_size: [6, 32]
    num_filters: 5
    stride: [6, 32]
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    # kernel/stride vertical dim must equal channels-per-gene-per-haplotype so Stage1 still
    # collapses one full gene block (all signal + mask tracks) into a single output row, same
    # design as pigmentation_binary.yaml. With feature_mode="signals_and_masks" + both indel
    # masks enabled that's 6 signal channels (2 strands x 3 ontology terms) + 4 mask channels
    # (insertion, deletion, valid, snp) = 10, vs. 6 for the signals_only baseline.
    kernel_stage1: [10, 32]
    stride_stage1: [10, 32]
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23: [1, 5]
    stride_stages23: [1, 2]
    padding_stages23: [0, 2]
    fc_hidden_size: 256
    global_pool_type: "avg"
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      random_state: 42
      n_jobs: -1
      eval_metric: "logloss"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "cross_entropy"
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    mode: "min"
    factor: 0.5
    patience: 30
    min_lr: 0.0000001
    step_size: 30
    T_max: 300
    eta_min: 0.0000001
    T_0: 50
    T_mult: 1

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-neural-legacy"
  run_name: "pigmentation-binary-all-masks"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  loading_strategy: "preload"
  # Default num_workers (4 train / 2 val) each fork a full copy of the preloaded in-memory
  # dataset (persistent_workers + Python refcounting breaks copy-on-write almost immediately),
  # multiplying RSS by (workers+1). The signals_only configs (132 rows/sample) just barely
  # survive that under 124GB RAM; this config's 220 rows/sample (masks add 4 channels/gene)
  # pushed 5 processes x ~30GB past available memory and got OOM-killed after epoch 1 in
  # three separate attempts. Since "preload" already means no per-item disk I/O happens during
  # training (everything is materialized upfront), worker processes add no throughput benefit
  # here -- disable them to keep this run single-process.
  train_num_workers: 0
  val_num_workers: 0

mode: "train"
test_dataset: "test"
