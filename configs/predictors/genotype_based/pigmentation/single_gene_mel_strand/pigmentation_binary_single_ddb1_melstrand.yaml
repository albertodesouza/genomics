metadata:
  note: >
    SINGLE-GENE ARM, MELANOCYTE + GENE STRAND -- DDB1 alone, ontology CL:1000458
    (melanocyte of skin), strand - (the strand DDB1 is transcribed from, read
    from the gene-level GENCODE record in gtf_cache.feather). One track per haplotype,
    2 rows per gene against 12 in the published arms. Generated by
    scripts/experiments/single_gene_sweep_melanocyte_strand.py. Identical to
    pigmentation_binary_no_alignment.yaml in split, seed, crop, layout, optimisation and
    architecture family; differs in genes_to_use, ontology_terms, track_strands, the
    stage-1 kernel/stride height (1 instead of 6, so stage 1 still emits one row per
    haplotype), an isolated results_dir, a namespaced processed_cache_dir, and run_name.
    Costs no AlphaGenome calls: the ontology and strand restriction is a column subset of
    predictions already on disk.
metadata:
  note: 'Pigmentation binary classifier (CNN2), the "no alignment" baseline in the
    DITA comparison notebook (genotype_cnn_alignment_deeplift.ipynb). Uses tensor_layout="raw_center_crop"
    instead of "haplotype_channels": each individual''s AlphaGenome prediction is
    simply center-cropped at the same reference-relative window position for everyone,
    with no per-individual or cohort-wide INDEL coordinate correction at all (contrast
    with DITA = Dynamic INDEL Tensor Alignment, tensor_layout="haplotype_channels"
    + alignment_mapping="bcftools_chain", used by pigmentation_binary.yaml and siblings).
    Same genes/ontologies/haplotype_mode/window_center_size/architecture/hyperparameters
    as pigmentation_binary.yaml ("DITA no masks") for a direct, apples-to-apples comparison
    of "no alignment" vs. DITA. raw_center_crop has no INDEL/SNP mask support (masks
    require the aligned axis), so feature_mode is fixed at "signals_only".

    '
dataset_input:
  dataset_id: 1kg_high_coverage
  processed_cache_dir: results/cache/genotype_based_predictor/pigmentation_mel_strand
  results_dir: results/genotype_based_predictor/runs_single_gene_ddb1_melstrand
  cache_processed_tensors: true
  alphagenome_outputs:
  - rna_seq
  haplotype_mode: H1+H2
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
  - DDB1
  ontology_terms:
  - CL:1000458
  tensor_layout: raw_center_crop
  feature_mode: signals_only
  selected_track_index: 0
  normalization_method: log
  normalization_value: 0.0
  normalization_fit_splits:
  - train
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true
  track_strands:
  - '-'
output:
  prediction_target: pigmentation
  known_classes:
  - strong pigmentation
  - weak pigmentation
  derived_targets:
    pigmentation:
      source_field: population
      exclude_unmapped: true
      class_map:
        strong pigmentation:
        - YRI
        - ESN
        - LWK
        - MSL
        - GWD
        weak pigmentation:
        - FIN
        - CEU
        - GBR
model:
  type: CNN2
  hidden_layers:
  - 100
  - 40
  activation: relu
  dropout_rate: 0.5
  cnn:
    kernel_size:
    - 1
    - 32
    num_filters: 5
    stride:
    - 1
    - 32
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    kernel_stage1:
    - 1
    - 32
    stride_stage1:
    - 1
    - 32
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23:
    - 1
    - 5
    stride_stages23:
    - 1
    - 2
    padding_stages23:
    - 0
    - 2
    fc_hidden_size: 256
    global_pool_type: avg
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: hist
      random_state: 42
      n_jobs: -1
      eval_metric: logloss
training:
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: cross_entropy
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: cosine_warm_restarts
    mode: min
    factor: 0.5
    patience: 30
    min_lr: 1.0e-07
    step_size: 30
    T_max: 300
    eta_min: 1.0e-07
    T_0: 50
    T_mult: 1
data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: family_aware
  balancing_strategy: shuffle
  strict_determinism: true
wandb:
  use_wandb: false
  project_name: genotype-based-predictor-neural-legacy
  run_name: pigmentation-binary-single-gene-ddb1-melstrand
  log_frequency: 100
checkpointing:
  checkpoint_dir: models
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null
debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}
data_loading:
  loading_strategy: preload
mode: train
test_dataset: test
