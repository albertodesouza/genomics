metadata:
  note: >
    14-gene specificity-control arm: the published eleven-gene pigmentation panel
    PLUS the three magnitude-matched pigmentation-irrelevant windows TPM2, SMCR8
    and PSMC4.

    WHY THIS EXISTS. The knockdown probe reports that seven of eleven panel genes
    move the classifier's decision and four do not, and the validity
    instrumentation shows that a flat response indicates non-reliance only where
    delivered perturbation is comparable to a responding gene. The within-panel
    version of that control is the OCA2-vs-MC1R contrast (OCA2 receives 1.5x
    MC1R's delivered perturbation and moves the decision 3% as much). What is
    still missing is the *between-panel* version: a gene with no role in the
    phenotype at all, at comparable delivered magnitude, failing to respond. A
    control gene must be INSIDE the classifier's input panel to have any Delta,
    which is why this is a retrain and not a re-analysis.

    GENE SELECTION. TPM2/SMCR8/PSMC4 were chosen by
    scripts/experiments/specificity_control_preflight.py, which measured total
    predicted RNA-seq signal inside the 32,768-unit crop on the reference window
    for eleven vetted pigmentation-irrelevant candidates. That proxy tracks
    realised |Delta_in| over the published panel at Spearman rho = 0.855
    (p = 0.0008). The three sit inside the responding panel range (5,526-68,860):

        TPM2   48,071   ~ TYR      48,068
        SMCR8  23,951   ~ MFSD12   26,326
        PSMC4  18,620   ~ MC1R     14,995

    Two of the eleven vetted candidates (LRRC36 29, PRSS55 23) sit in the same
    dead zone as EDAR (34) and TCHH (68), where a flat response carries no
    information about reliance. Selecting controls by biological irrelevance
    ALONE had roughly a 2-in-11 chance per gene of producing an uninterpretable
    result after a 6,432-call build and a retrain.

    LAYOUT. raw_center_crop, not DITA. The gene-level knockdown readout is a
    per-gene scalar and carries no positional index, and the paper's alignment
    section establishes empirically that an unaligned classifier recovers the
    aligned model's ranking (Spearman rho = 0.83, signs 10/11). No DITA axis
    exists for the control windows and building one would cost hours for a
    property this measurement does not use. The published unaligned tracks-only
    reference is 0.926/0.923 on pigmentation.

    PRE-REGISTERED READING, fixed before the knockdown is run. The three control
    genes bracket TYR, MFSD12 and MC1R on delivered magnitude, so
    |Delta_in| must be reported alongside |Delta| for every one of the fourteen.
      - All three control genes flat, with |Delta_in| confirmed in the responding
        range -> specificity established; this becomes the probe's main positive
        claim.
      - Any control gene responding at panel-gene magnitude -> the probe responds
        to delivered perturbation at any well-expressed locus, and the reliance
        reading of the whole ranking is in trouble. Report this outcome; it is
        the most informative one.
      - Mixed -> report per-gene against delivered magnitude. Do not average.

    Note the prior on this has shifted. The 3-vs-3 magnitude-matched accuracy
    control (runs_three_vs_three/) found the tracks representation is NOT
    phenotype-specific at the level of classification: three irrelevant windows
    classify the pigmentation proxy as well as three magnitude-matched panel
    windows (0.9506 vs 0.9383). A control gene responding to the knockdown is
    therefore no longer the surprising branch. The knockdown asks a different
    question from classifier accuracy, so the two are not redundant, but this
    config's reading was written when the tracks side was still assumed specific.

    LIKE-FOR-LIKE. The retrain changes the classifier, so the eleven published
    Delta values are NOT comparable to this run's. All fourteen must be measured
    on this model. The 11-gene raw_center_crop reference values are in
    results/genotype_based_predictor/knockout_bulk/pigmentation_test_split_knockout_no_alignment.csv.

    Everything except genes_to_use, results_dir and run_name is byte-identical to
    pigmentation_binary_no_alignment.yaml.

    Cache note: the 11-gene signals_only view is 18 GB; 14 genes is ~23 GB.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/pigmentation"
  # ISOLATED results dir. The run name is derived from architecture/layout
  # parameters and does NOT include the gene list, so a 14-gene raw_center_crop
  # run resolves to exactly the same directory as the published 11-gene
  # no_alignment run and would overwrite it. That happened on 2026-09-06 with a
  # 3-gene arm and destroyed the published checkpoints. Keep this arm isolated.
  results_dir: "results/genotype_based_predictor/runs_specificity_14gene"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "MC1R"
    - "TYRP1"
    - "TYR"
    - "SLC45A2"
    - "DDB1"
    - "EDAR"
    - "MFSD12"
    - "OCA2"
    - "HERC2"
    - "SLC24A5"
    - "TCHH"
    # --- specificity controls: no GO annotation under pigmentation, melanin
    # --- biosynthesis or melanocyte differentiation; magnitude-matched above.
    - "TPM2"
    - "SMCR8"
    - "PSMC4"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # No alignment: legacy raw center-crop layout, no INDEL-aware coordinate axis
  tensor_layout: "raw_center_crop"
  feature_mode: "signals_only"
  selected_track_index: 0

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "pigmentation"
  known_classes:
    - "strong pigmentation"
    - "weak pigmentation"
  derived_targets:
    pigmentation:
      source_field: "population"
      exclude_unmapped: true
      class_map:
        strong pigmentation: ["YRI", "ESN", "LWK", "MSL", "GWD"]
        weak pigmentation: ["FIN", "CEU", "GBR"]

model:
  type: "CNN2"
  hidden_layers: [100, 40]
  activation: "relu"
  dropout_rate: 0.5
  cnn:
    kernel_size: [6, 32]
    num_filters: 5
    stride: [6, 32]
    padding: 0
    pool_size: null
  cnn2:
    num_filters_stage1: 16
    # Same per-gene-per-haplotype channel count as pigmentation_binary.yaml's signals_only
    # layout: 2 strands x 3 ontology terms = 6, no mask channels (raw_center_crop has none).
    kernel_stage1: [6, 32]
    stride_stage1: [6, 32]
    num_filters_stage2: 32
    num_filters_stage3: 64
    kernel_stages23: [1, 5]
    stride_stages23: [1, 2]
    padding_stages23: [0, 2]
    fc_hidden_size: 256
    global_pool_type: "avg"
  sklearn:
    pca_components: 300
    use_pca_cache: true
    pca_align_n_train: false
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: "hist"
      random_state: 42
      n_jobs: -1
      eval_metric: "logloss"

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  loss_function: "cross_entropy"
  batch_size: 256
  num_epochs: 400
  validation_frequency: 3
  lr_scheduler:
    enabled: true
    type: "cosine_warm_restarts"
    mode: "min"
    factor: 0.5
    patience: 30
    min_lr: 0.0000001
    step_size: 30
    T_max: 300
    eta_min: 0.0000001
    T_0: 50
    T_mult: 1

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-neural-legacy"
  run_name: "pigmentation-binary-no-alignment-14gene"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  # DRIFT FROM pigmentation_binary_no_alignment.yaml, and the only one besides
  # genes_to_use / results_dir / run_name.
  #
  # "preload" holds the whole materialised dataset in the parent process; each
  # DataLoader worker then forks it and Python refcounting breaks copy-on-write
  # page sharing, so the resident set multiplies by the worker count. At eleven
  # genes that fits; at fourteen it does not. Measured on 2026-09-07: parent
  # 34 GB plus six workers at ~19 GB each on a 121 GB machine -> 10 GB of swap
  # and sustained thrashing, with data_wait = 172 s against compute = 2.4 s per
  # epoch (data_fraction 98.6%). Projected wall time ~20 h, with a real risk of
  # the OOM killer ending it partway.
  #
  # "lazy" reads each item from the shard cache on demand. It cannot change any
  # number: the tensors, the split, the sample order (strict_determinism with
  # seed 13) and the optimisation are all identical -- only when bytes are
  # fetched differs. Revert to "preload" if this ever runs on a machine with
  # room for it.
  loading_strategy: "lazy"

mode: "train"
test_dataset: "test"
