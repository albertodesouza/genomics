metadata:
  note: >
    Simple linear baseline for the pigmentation binary task, sharing the exact same
    dataset_input/output config as pigmentation_binary.yaml (CNN2) so results are directly
    comparable -- see notebooks/pigmentation_alphagenome_cnn_variant_scoring.ipynb Section 9
    (TWAS-vs-GWAS comparison) for how this is used.

dataset_input:
  dataset_id: "1kg_high_coverage"
  processed_cache_dir: "results/cache/genotype_based_predictor/pigmentation"
  results_dir: "results/genotype_based_predictor/runs"
  cache_processed_tensors: true

  # Track selection
  alphagenome_outputs:
    - "rna_seq"
  haplotype_mode: "H1+H2"
  window_center_size: 32768
  downsample_factor: 1
  genes_to_use:
    - "MC1R"
    - "TYRP1"
    - "TYR"
    - "SLC45A2"
    - "DDB1"
    - "EDAR"
    - "MFSD12"
    - "OCA2"
    - "HERC2"
    - "SLC24A5"
    - "TCHH"
  ontology_terms:
    - "CL:1000458"
    - "CL:0000346"
    - "CL:2000092"

  # Alignment and feature selection
  tensor_layout: "haplotype_channels"
  feature_mode: "signals_only"
  selected_track_index: 0
  indel_include_valid_mask: false
  indel_include_snp_mask: false
  alignment_mapping: "bcftools_chain"
  consensus_dataset_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"
  alignment_axis_splits:
    - train

  # Normalization
  normalization_method: "log"
  normalization_value: 0.0
  normalization_fit_splits: ["train"]
  normalization_fit_sample_fraction: 1.0
  normalization_fit_min_samples: 0
  normalization_fit_min_samples_per_class: 0
  normalization_fit_random_seed: 13
  normalization_fit_stratify: true

output:
  prediction_target: "pigmentation"
  known_classes:
    - "strong pigmentation"
    - "weak pigmentation"
  derived_targets:
    pigmentation:
      source_field: "population"
      exclude_unmapped: true
      class_map:
        strong pigmentation: ["YRI", "ESN", "LWK", "MSL", "GWD"]
        weak pigmentation: ["FIN", "CEU", "GBR"]

model:
  type: "LOGREG"
  sklearn:
    pca_components: 300
    pca_backend: "randomized_streaming"
    randomized_pca_oversampling: 32
    randomized_pca_n_iter: 2
    randomized_pca_feature_chunk_size: 8192
    randomized_pca_dtype: "float32"
    use_pca_cache: true
    pca_align_n_train: false
    logistic_regression:
      C: 1.0
      penalty: "l2"
      solver: "saga"
      max_iter: 5000
      class_weight: "balanced"
      n_jobs: -1

training:
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0
  loss_function: "cross_entropy"
  batch_size: 16
  num_epochs: 1
  validation_frequency: 1
  lr_scheduler:
    enabled: false

data_split:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 13
  family_split_mode: "family_aware"
  balancing_strategy: "shuffle"
  strict_determinism: true

wandb:
  use_wandb: false
  project_name: "genotype-based-predictor-pigmentation-logreg"
  run_name: "pigmentation-binary-logreg"
  log_frequency: 100

checkpointing:
  checkpoint_dir: "models"
  save_frequency: 100
  save_during_training: true
  load_checkpoint: null

debug:
  enable_visualization: false
  force_pca_cache_rebuild: false
  max_samples_per_epoch: null
  taint_at_cache_save: false
  taint_at_runtime: false
  visualization: {}

data_loading:
  loading_strategy: "lazy"
  cache_size: 50

mode: "train"
test_dataset: "test"
