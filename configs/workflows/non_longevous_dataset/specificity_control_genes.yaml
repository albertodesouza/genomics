# ═══════════════════════════════════════════════════════════════════
# Configuration — Specificity-control windows (TPM2, SMCR8, PSMC4)
# ═══════════════════════════════════════════════════════════════════
#
# Adds three control-gene windows to the existing 1kg_high_coverage dataset,
# for the 1072 individuals of the pigmentation cohort (8 populations).
#
# Purpose. The published knockdown probe shows that seven of eleven panel genes
# move the classifier's decision and four do not. The missing control is whether
# a gene with *no* pigmentation role but a *comparable delivered perturbation*
# also fails to respond. A control gene must be inside the classifier's input
# panel to have any Delta at all, so this run supplies the windows for a
# 14-gene retrain.
#
# Gene selection. Chosen by scripts/experiments/specificity_control_preflight.py,
# which measured the total predicted RNA-seq signal inside the 32,768-unit crop
# on the reference window for eleven vetted pigmentation-irrelevant candidates.
# That proxy tracks realised delivered perturbation over the published panel at
# Spearman rho = 0.855 (p = 0.0008). TPM2 (48,071), SMCR8 (23,951) and PSMC4
# (18,620) all sit inside the responding panel genes' range (5,526-68,860),
# whereas LRRC36 (29) and PRSS55 (23) would have landed in the same dead zone as
# EDAR (34) and TCHH (68), where a flat response carries no information about
# reliance. None of the three carries a Gene Ontology annotation under
# pigmentation, melanin biosynthesis or melanocyte differentiation.
#
# Writes into the canonical dataset layout alongside the existing eleven
# windows: individuals/<sample>/windows/<gene>/. Additive and resumable; no
# existing window is touched.
#
# Expected cost: 1072 individuals x 3 genes x 2 haplotypes = 6,432 AlphaGenome
# calls, ~25 GB on disk.
# ═══════════════════════════════════════════════════════════════════

project:
  name: "specificity_control_genes"
  description: "Three magnitude-matched pigmentation-irrelevant windows for the specificity control"
  output_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"

debug:
  create_dataset_with_reference_genome_only: false

# ═══════════════════════════════════════════════════════════════════
# Data Sources
# ═══════════════════════════════════════════════════════════════════

data_sources:
  metadata_csv: "../../../docs/historical/1000-genomes/1000_genomes_metadata.csv"

  reference:
    fasta: "/dados/GENOMICS_DATA/top3/refs/GRCh38_full_analysis_set_plus_decoy_hla.fa"
    name: "GRCh38"

  vcf_pattern: "/dados/GENOMICS_DATA/top3/longevity_dataset/vcf_chromosomes/1kGP_high_coverage_Illumina.{chrom}.filtered.SNV_INDEL_SV_phased_panel.vcf.gz"

# ═══════════════════════════════════════════════════════════════════
# Sample Selection — the 1072 individuals of the pigmentation cohort
# ═══════════════════════════════════════════════════════════════════

sample_selection:
  level: "population"

  # Large enough to take every individual in each included population.
  samples_per_group: 10000

  # strong pigmentation: YRI ESN LWK MSL GWD  |  weak: FIN CEU GBR
  # 178 + 149 + 99 + 99 + 178 + 99 + 179 + 91 = 1072
  include_groups:
    - "YRI"
    - "ESN"
    - "LWK"
    - "MSL"
    - "GWD"
    - "FIN"
    - "CEU"
    - "GBR"

  exclude_groups: []
  sex_filter: "all"
  random_seed: 42

# ═══════════════════════════════════════════════════════════════════
# build_window_and_predict.py Parameters
# ═══════════════════════════════════════════════════════════════════

build_window_params:
  mode: "gene"

  gene:
    symbol: null
    id: null
    gene_list_file: ../../../docs/gene_lists/specificity_control_genes.txt

  snp:
    snp_list_file: "../../../third_party/FROGAncestryCalc/SNPInfo/55_aisnps_alleles_grch38.txt"

  gtf_feather: null

  # Identical to the eleven published windows: 512 kbp centred on gene midpoint.
  window_size: 524288

  skip_h2: false
  also_iupac: false

  predict: true
  api_key: "${ALPHAGENOME_API_KEY}"

  outputs: "RNA_SEQ"

  # Same three ontologies as the published panel: melanocyte of skin, hair
  # follicle dermal papilla cell, hair follicular keratinocyte.
  ontology: "CL:1000458,CL:0000346,CL:2000092"

  all_tissues: false

  api_rate_limit_delay: 0.5

  # Timeouts. The first launch of this run (2026-09-03) stalled sixteen minutes
  # in, at 45/1072 samples, and sat there for three days: the AlphaGenome client
  # issues its RPC with no deadline, so a dropped connection blocks forever and
  # the library's own retry never fires. api_timeout is a per-call deadline
  # (600s is ~1.7x the slowest of 270 calls observed on a 524288 bp window:
  # median 3.7s, p95 43s, max 355s); on expiry the channel is rebuilt and the
  # call retried. subprocess_timeout is the per-sample backstop against a wedge
  # that escapes the deadline -- observed per-sample cost is ~2.8 min, so 1h is
  # 20x headroom. A timed-out sample stays pending in the checkpoint and is
  # retried on the next run.
  api_timeout: 600.0
  api_max_attempts: 3
  subprocess_timeout: 3600.0

# ═══════════════════════════════════════════════════════════════════
# Pipeline Execution Steps
# ═══════════════════════════════════════════════════════════════════

pipeline:
  steps:
    analyze_metadata: true
    select_samples: true
    validate_vcfs: true
    run_predictions: true
    generate_report: true

    # The existing dataset_metadata.json already describes the eleven published
    # windows and 3202 individuals. Regenerate it only after this run lands, so
    # a mid-run crash cannot leave the catalogue describing a partial panel.
    generate_dataset_metadata: false

  parallel:
    enabled: true
    n_workers: 4

  resume_from_checkpoint: true
  checkpoint_file: "specificity_control_genes_checkpoint.json"

logging:
  level: "INFO"
  log_file: "specificity_control_genes.log"
  console_output: true
