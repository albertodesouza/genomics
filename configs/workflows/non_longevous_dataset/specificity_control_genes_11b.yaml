# ═══════════════════════════════════════════════════════════════════
# Configuration — Specificity-control windows, third batch (11 genes)
# ═══════════════════════════════════════════════════════════════════
#
# Takes the control arm from eleven genes to twenty-two, against the same
# eleven pigmentation genes. Adds windows for the 1072 individuals of the
# pigmentation cohort to the existing 1kg_high_coverage dataset.
#
# WHY. At eleven-vs-eleven the specificity comparison did not separate the
# groups (Mann-Whitney p = 0.106) and, more importantly, was unstable: the
# full leave-one-out has two genes individually crossing 0.05 in OPPOSITE
# directions -- LRRC36 (control) at 0.042 and HERC2 (panel) at 0.049. That is
# not one outlier to be argued away, it is the sample size. Doubling the
# control arm is the cheapest move that addresses it, because it needs no
# retrain of anything already measured: in the single-gene design each gene
# carries its own classifier.
#
# GENE SELECTION -- read this before changing anything here.
#
# These eleven are the "random_11_2" panel, drawn for the unrelated
# non-longevous-dataset project
# (/dados/GENOMICS_DATA/top3/non_longevous_results_genes_1000_random_11_2/)
# and reused here rather than redrawn. That provenance is the point: the draw
# was made before, and independently of, the specificity question, so no
# choice of ours could have tuned it to the outcome. It is the same
# provenance as random_11_1, which supplied the first eleven controls.
#
# The set is taken WHOLE and IN FULL. Unlike the second batch, where the
# preflight magnitude proxy decided which of the vetted pool to build first,
# nothing here is selected, ordered or dropped on any measured quantity. The
# preflight was run for these eleven anyway
# (results/genotype_based_predictor/specificity_control_preflight_11b.json)
# and is recorded BEFORE the build as a pre-registration -- it does not alter
# the set. Substituting a gene because its predicted signal looks
# inconvenient would reintroduce exactly the selection the first batch was
# criticised for, and would silently destroy the one property that makes this
# batch worth its API cost.
#
# A SIDE BENEFIT WORTH NAMING. The paper's expression floor is calibrated
# against 40 random 524 kbp WINDOWS, and the appendix already concedes the
# weakness of that anchor: a random window is not gene-centred, so its crop
# signal measures a neighbourhood rather than a target gene. Eleven random
# GENES give a gene-centred null for the same floor, which is a strictly
# better calibration than the one currently published.
#
# GO SCREEN. None of the eleven carries a Gene Ontology annotation under
# pigmentation (GO:0043473), melanin biosynthetic process (GO:0042438),
# melanocyte differentiation (GO:0030318), or any GO term whose name contains
# pigment / melanin / melanocyte. Checked via MyGene.info against current
# human annotations, 2026-09-09; 4 to 68 annotated terms per gene, so the
# clean result is a real absence and not an empty record.
#
# Two caveats kept in view rather than hidden, in the spirit of the SPRED2
# note in scripts/experiments/random_gene_genotype_control.py:
#
#   EGF   EGFR signalling is documented to modulate melanogenesis, and EGF is
#         a standard component of melanocyte culture medium. It carries no
#         pigmentation GO term, so it is kept -- but it is the most likely
#         gene here for a reviewer to challenge.
#   TRHR  The cutaneous neuroendocrine literature reports TRH stimulating
#         melanogenesis in human skin via a local TRH/POMC axis, and TRHR is
#         skin-expressed. Again no pigmentation GO term, again kept, again
#         flagged.
#
# Neither is removed. Removing a gene on suspicion after the draw is itself a
# selection, and with the analysis unpicked either way it is better to carry
# two nameable risks in the open than to hand-clean the set.
#
# WINDOW REUSE CONSIDERED AND REJECTED. All 1300 individuals of random_11_2
# lie inside the v1 cohort, and 400 of them are in the 1072 pigmentation
# cohort, with identical window size (524288) and identical ontologies -- so
# 400 x 11 x 2 = 8,800 calls could in principle have been copied instead of
# spent. Rejected: the stored random_11_2 window for CD47 reproduces from the
# v1 GTF exactly, but the same reconstruction of TYR lands 1 bp off, so the
# two builds' midpoint conventions could not be shown to agree bit for bit.
# A 1 bp offset affecting 400 of 1072 individuals would be a systematic split
# of the cohort that no downstream check would catch. Uniform provenance is
# worth the calls.
#
# COST. 1072 individuals x 11 genes x 2 haplotypes = 23,584 AlphaGenome calls
# for the windows, plus 162 x 11 x 2 haplotypes x 2 methods = 7,128 for the
# knockdown and null scrambles. ~30,700 calls, ~90 GB on disk, and ~8 h of GPU
# for the eleven arms. Additive and resumable; no existing window is touched.
# ═══════════════════════════════════════════════════════════════════

project:
  name: "specificity_control_genes_11b"
  description: "The random_11_2 draw, taken whole, to double the specificity control arm"
  output_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"

debug:
  create_dataset_with_reference_genome_only: false

# ═══════════════════════════════════════════════════════════════════
# Data Sources
# ═══════════════════════════════════════════════════════════════════

data_sources:
  metadata_csv: "../../../docs/historical/1000-genomes/1000_genomes_metadata.csv"

  reference:
    fasta: "/dados/GENOMICS_DATA/top3/refs/GRCh38_full_analysis_set_plus_decoy_hla.fa"
    name: "GRCh38"

  vcf_pattern: "/dados/GENOMICS_DATA/top3/longevity_dataset/vcf_chromosomes/1kGP_high_coverage_Illumina.{chrom}.filtered.SNV_INDEL_SV_phased_panel.vcf.gz"

# ═══════════════════════════════════════════════════════════════════
# Sample Selection — the 1072 individuals of the pigmentation cohort
# ═══════════════════════════════════════════════════════════════════

sample_selection:
  level: "population"

  # Large enough to take every individual in each included population.
  samples_per_group: 10000

  # strong pigmentation: YRI ESN LWK MSL GWD  |  weak: FIN CEU GBR
  # 178 + 149 + 99 + 99 + 178 + 99 + 179 + 91 = 1072
  include_groups:
    - "YRI"
    - "ESN"
    - "LWK"
    - "MSL"
    - "GWD"
    - "FIN"
    - "CEU"
    - "GBR"

  exclude_groups: []
  sex_filter: "all"
  random_seed: 42

# ═══════════════════════════════════════════════════════════════════
# build_window_and_predict.py Parameters
# ═══════════════════════════════════════════════════════════════════

build_window_params:
  mode: "gene"

  gene:
    symbol: null
    id: null
    gene_list_file: ../../../docs/gene_lists/specificity_control_genes_11b.txt

  snp:
    snp_list_file: "../../../third_party/FROGAncestryCalc/SNPInfo/55_aisnps_alleles_grch38.txt"

  gtf_feather: null

  # Identical to the eleven published windows: 512 kbp centred on gene midpoint.
  window_size: 524288

  skip_h2: false
  also_iupac: false

  predict: true
  api_key: "${ALPHAGENOME_API_KEY}"

  outputs: "RNA_SEQ"

  # Same three ontologies as the published panel: melanocyte of skin, hair
  # follicle dermal papilla cell, hair follicular keratinocyte.
  ontology: "CL:1000458,CL:0000346,CL:2000092"

  all_tissues: false

  api_rate_limit_delay: 0.5

  # Same deadlines as the second batch, which completed 1072/1072 with 0
  # failures under them. api_timeout is a per-call deadline; on expiry the
  # channel is rebuilt and the call retried, because the AlphaGenome client
  # issues its RPC with no deadline of its own and a dropped connection
  # otherwise blocks forever. subprocess_timeout is the per-sample backstop.
  api_timeout: 600.0
  api_max_attempts: 3
  subprocess_timeout: 3600.0

# ═══════════════════════════════════════════════════════════════════
# Pipeline Execution Steps
# ═══════════════════════════════════════════════════════════════════

pipeline:
  steps:
    analyze_metadata: true
    select_samples: true
    validate_vcfs: true
    run_predictions: true
    generate_report: true

    # Leave the catalogue alone until the run lands, so a mid-run crash cannot
    # leave dataset_metadata.json describing a partial panel.
    generate_dataset_metadata: false

  parallel:
    enabled: true
    n_workers: 4

  resume_from_checkpoint: true
  checkpoint_file: "specificity_control_genes_11b_checkpoint.json"

logging:
  level: "INFO"
  log_file: "specificity_control_genes_11b.log"
  console_output: true
