# ═══════════════════════════════════════════════════════════════════
# Configuration — Specificity-control windows, fourth batch (11 genes)
# ═══════════════════════════════════════════════════════════════════
#
# Takes the control arm from twenty-two genes to thirty-three, against the same
# nine pigmentation genes. Adds windows for the 1072 individuals of the
# pigmentation cohort to the existing 1kg_high_coverage dataset.
#
# WHY. At 9 against 22 the accuracy ranking separates the groups (AUC 0.9015,
# p = 0.00009) and the variant-level gene score does too (Sidak x Li & Ji AUC
# 0.7374, p = 0.0206) -- the latter only crossed 0.05 when the second draw was
# added, which is direct evidence that the earlier non-result at 9 against 11
# was sample size and not absence of signal. Thirty-three controls is the next
# step on the same curve, and in the single-gene design it costs no retrain of
# anything already measured: each gene carries its own classifier.
#
# GENE SELECTION -- read this before changing anything here.
#
# These eleven are the third random draw made for the unrelated
# non-longevous-dataset project. NOTE THE NAMING TRAP: its directory carries no
# numeric suffix, it is
# /dados/GENOMICS_DATA/top3/non_longevous_results_genes_1000_random/
# where the other two are ..._random_11_1 and ..._random_11_2. A glob on
# `random_11_*` misses it, which is why it sat unused.
#
# It is the EARLIEST of the three: metadata dated 2026-01-23, windows built
# 2025-12-29, against 2026-01-24 and 2026-01-25 for the two already in the
# paper. So its provenance is the strongest of the three -- drawn before, and
# independently of, the specificity question, so no choice of ours could have
# tuned it to the outcome.
#
# The set is taken WHOLE and IN FULL. Nothing here is selected, ordered or
# dropped on any measured quantity.
#
# GO SCREEN. None of the eleven carries a Gene Ontology annotation under
# pigmentation (GO:0043473), melanin biosynthetic process (GO:0042438),
# melanocyte differentiation (GO:0030318), or any GO term whose name contains
# pigment / melanin / melanocyte. Run 2026-09-12 by
# scripts/experiments/pigmentation_annotation_screen.py -- symbol to accession
# via UniProt REST, annotations via QuickGO -- and recorded at
# results/genotype_based_predictor/annotation_screen/screen_20260912.json.
# 0 to 34 annotated terms per gene.
#
# NOTE ON THE TERM COUNTS. The second batch records "4 to 68 annotated terms per
# gene" from MyGene.info; this screen reads QuickGO and gives 1 to 22 for the
# FIRST batch on re-run. The verdicts agree and the sources differ, so the
# counts are not comparable across batches. The instrument used here is the one
# that is re-runnable.
#
# One caveat kept in view rather than hidden, in the spirit of the SPRED2 note
# in scripts/experiments/random_gene_genotype_control.py:
#
#   C6orf52  carries ZERO GO annotations of any kind, so the screen clears it
#            VACUOUSLY. That is not the same as clearing it. An uncharacterised
#            ORF cannot be shown to have no pigmentation role by an annotation
#            screen, and this note exists so nobody mistakes an empty record for
#            evidence. It is kept: dropping a gene after the draw is itself a
#            selection. (The same weakness already sits inside the paper's own
#            top ten: LRRC36 carries a single annotated term.)
#
# WINDOW REUSE CONSIDERED AND REJECTED -- TWICE, ON INDEPENDENT GROUNDS.
#
#   1. Coverage. Only 400 of the 1072 pigmentation-cohort individuals exist in
#      the third draw at all: its 1300 are a deliberate 50-per-population
#      subsample across the eight class-map populations. Reusing them would
#      train these eleven arms on 400 individuals (250 strong / 150 weak) with a
#      different split, a different normalisation fit and a majority baseline of
#      0.625 against 0.7099 -- not comparable to the other 31 arms.
#
#   2. Determinism. AlphaGenome is not reproducible call to call. For CD47 the
#      input sequence fed to the model is byte-identical between the two builds
#      (md5 match on *.window.fixed.fa) and the predictions still differ at
#      944,619 of 3,145,728 positions, up to 0.125 absolute, ~0.1% in per-track
#      sums. Mixing vintages across arms is a confound with no downstream check.
#
#   The 11b config records a third, independent reason: the stored window for
#   TYR reconstructs 1 bp off the v1 convention, so the two builds' midpoints
#   could not be shown to agree bit for bit. Uniform provenance is worth the
#   calls.
#
# COST. 1072 individuals x 11 genes x 2 haplotypes = 23,584 AlphaGenome calls
# for the windows, plus 162 x 11 x 2 haplotypes x 2 methods = 7,128 for the
# knockdown and null scrambles. ~30,700 calls, ~90 GB on disk, and ~8 h of GPU
# for the eleven arms. Additive and resumable; no existing window is touched.
# ═══════════════════════════════════════════════════════════════════

project:
  name: "specificity_control_genes_11c"
  description: "The third pre-existing random draw, taken whole, to take the control arm from 22 to 33"
  output_dir: "/dados/GENOMICS_DATA/v1/1kG_high_coverage"

debug:
  create_dataset_with_reference_genome_only: false

# ═══════════════════════════════════════════════════════════════════
# Data Sources
# ═══════════════════════════════════════════════════════════════════

data_sources:
  metadata_csv: "../../../docs/historical/1000-genomes/1000_genomes_metadata.csv"

  reference:
    fasta: "/dados/GENOMICS_DATA/top3/refs/GRCh38_full_analysis_set_plus_decoy_hla.fa"
    name: "GRCh38"

  vcf_pattern: "/dados/GENOMICS_DATA/top3/longevity_dataset/vcf_chromosomes/1kGP_high_coverage_Illumina.{chrom}.filtered.SNV_INDEL_SV_phased_panel.vcf.gz"

# ═══════════════════════════════════════════════════════════════════
# Sample Selection — the 1072 individuals of the pigmentation cohort
# ═══════════════════════════════════════════════════════════════════

sample_selection:
  level: "population"

  # Large enough to take every individual in each included population.
  samples_per_group: 10000

  # strong pigmentation: YRI ESN LWK MSL GWD  |  weak: FIN CEU GBR
  # 178 + 149 + 99 + 99 + 178 + 99 + 179 + 91 = 1072
  include_groups:
    - "YRI"
    - "ESN"
    - "LWK"
    - "MSL"
    - "GWD"
    - "FIN"
    - "CEU"
    - "GBR"

  exclude_groups: []
  sex_filter: "all"
  random_seed: 42

# ═══════════════════════════════════════════════════════════════════
# build_window_and_predict.py Parameters
# ═══════════════════════════════════════════════════════════════════

build_window_params:
  mode: "gene"

  gene:
    symbol: null
    id: null
    gene_list_file: ../../../docs/gene_lists/specificity_control_genes_11c.txt

  snp:
    snp_list_file: "../../../third_party/FROGAncestryCalc/SNPInfo/55_aisnps_alleles_grch38.txt"

  gtf_feather: null

  # Identical to the eleven published windows: 512 kbp centred on gene midpoint.
  window_size: 524288

  skip_h2: false
  also_iupac: false

  predict: true
  api_key: "${ALPHAGENOME_API_KEY}"

  outputs: "RNA_SEQ"

  # Same three ontologies as the published panel: melanocyte of skin, hair
  # follicle dermal papilla cell, hair follicular keratinocyte.
  ontology: "CL:1000458,CL:0000346,CL:2000092"

  all_tissues: false

  api_rate_limit_delay: 0.5

  # Same deadlines as the second batch, which completed 1072/1072 with 0
  # failures under them. api_timeout is a per-call deadline; on expiry the
  # channel is rebuilt and the call retried, because the AlphaGenome client
  # issues its RPC with no deadline of its own and a dropped connection
  # otherwise blocks forever. subprocess_timeout is the per-sample backstop.
  api_timeout: 600.0
  api_max_attempts: 3
  subprocess_timeout: 3600.0

# ═══════════════════════════════════════════════════════════════════
# Pipeline Execution Steps
# ═══════════════════════════════════════════════════════════════════

pipeline:
  steps:
    analyze_metadata: true
    select_samples: true
    validate_vcfs: true
    run_predictions: true
    generate_report: true

    # Leave the catalogue alone until the run lands, so a mid-run crash cannot
    # leave dataset_metadata.json describing a partial panel.
    generate_dataset_metadata: false

  parallel:
    enabled: true
    n_workers: 4

  resume_from_checkpoint: true
  checkpoint_file: "specificity_control_genes_11c_checkpoint.json"

logging:
  level: "INFO"
  log_file: "specificity_control_genes_11c.log"
  console_output: true
