name: Visualizer tests

on:
  push:
    branches:
      - main
    paths:
      - "src/genomics/visualizer/**"
      - "src/genomics/workflows/alphagenome/**"
      - "tests/test_visualizer*.py"
      - "pyproject.toml"
      - ".github/workflows/visualizer-tests.yml"
  pull_request:
    paths:
      - "src/genomics/visualizer/**"
      - "src/genomics/workflows/alphagenome/**"
      - "tests/test_visualizer*.py"
      - "pyproject.toml"
      - ".github/workflows/visualizer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with the visualizer and browser-test extras
        run: python -m pip install -e ".[visualizer,test-ui]"

      - name: Install headless Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run visualizer tests (API, workflows and browser smoke tests)
        run: python -m pytest tests/test_visualizer.py tests/test_visualizer_startup.py tests/test_visualizer_knowledge.py tests/test_visualizer_workflows.py tests/test_visualizer_variants.py tests/test_visualizer_frontend.py -q
